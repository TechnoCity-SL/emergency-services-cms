app = "emergency-services-cms"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "1337"
  NODE_ENV = "production"
  PUBLIC_URL = "https://emergency-services-cms.fly.dev"
  IS_PROXIED = "true"
  STRAPI_TELEMETRY_DISABLED = "true"

[http_service]
  internal_port = 1337
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    method = "GET"
    timeout = "10s"
    path = "/admin/init"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
