name: Deploy to Fly

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; a newer push waits for the current deploy to finish.
concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Fly
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # fly.toml is not committed (see .gitignore), so flyctl uses the config already
      # deployed on the Fly app named by the FLY_APP_NAME repository variable.
      - name: Deploy
        run: flyctl deploy --app "$FLY_APP_NAME" --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP_NAME: ${{ vars.FLY_APP_NAME }}
